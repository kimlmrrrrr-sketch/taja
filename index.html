<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타자 레이스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<!-- Supabase 라이브러리 (실시간 통신용) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<style>
  :root { --ink:#3b3355; --muted:#8b84a3; --paper:#fff; --bg:#fff6dc; --line:#ece4d3;
    --yellow:#ffd84d; --yellow-soft:#fff4c2; --pink:#ff9ec4; --pink-soft:#ffe3ef; --mint:#8fe3c8; --mint-soft:#ddf8ee;
    --sky:#9cc9ff; --sky-soft:#e3f0ff; --lav:#c4b2ff; --lav-soft:#efe9ff; --accent:#7b61ff; --good:#22b573; --bad:#ff5c7a; --warn:#ffa63d; --gold:#e0a500;
    --display:"Jua","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { color:var(--ink); background-color:var(--bg); background-image:radial-gradient(#ffd9a0 1.6px, transparent 1.8px); background-size:24px 24px;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  body.shake { animation:bodyshake .35s; }
  @keyframes bodyshake { 20% { transform:translate(-8px,3px); } 40% { transform:translate(8px,-3px); } 60% { transform:translate(-6px,2px); } 80% { transform:translate(5px,-2px); } }
  h1, h2, h3 { font-family:var(--display); font-weight:400; margin:0; }
  .hidden { display:none !important; }
  button { font:inherit; color:var(--ink); cursor:pointer; background:var(--paper); border:3px solid var(--ink); border-radius:16px; padding:8px 16px; box-shadow:3px 3px 0 var(--ink); transition:transform .08s, box-shadow .08s; }
  button:hover:not(:disabled) { transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink); }
  button:active:not(:disabled) { transform:translate(3px,3px); box-shadow:0 0 0 var(--ink); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--yellow); font-family:var(--display); font-size:19px; }
  input, select, textarea { font:inherit; color:var(--ink); padding:11px 14px; border:3px solid var(--ink); border-radius:14px; background:#fff; outline:none; }
  input:focus, select:focus, textarea:focus { background:var(--yellow-soft); }
  .card { background:var(--paper); border:3px solid var(--ink); border-radius:22px; box-shadow:4px 4px 0 var(--ink); }
  .banner { background:var(--yellow-soft); border-bottom:3px solid var(--ink); padding:6px 16px; font-size:13px; text-align:center; }

  /* 입장 */
  #join { max-width:440px; margin:48px auto; padding:30px; }
  #join .logo { text-align:center; font-size:46px; line-height:1; }
  #join h1 { font-size:46px; text-align:center; margin-top:6px; }
  #join .sub { color:var(--muted); margin:10px 0 20px; text-align:center; font-size:15px; }
  #join .sub.err { color:var(--bad); font-weight:700; }
  #join label { display:block; font-family:var(--display); font-size:17px; margin:14px 0 6px; }
  #join input { width:100%; }
  #join .joinhelp { font-size:12px; color:var(--muted); margin:8px 0 0; line-height:1.5; }
  #join .row { display:flex; gap:12px; margin-top:24px; }
  #join .row > * { flex:1; padding:12px; font-family:var(--display); font-size:20px; }
  .watchbtn { width:100%; margin-top:12px; font-size:15px; background:var(--sky-soft); }

  /* 게임 */
  #game { max-width:900px; margin:0 auto; padding:14px 14px 28px; }
  .topbar { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; padding:10px 16px; }
  .roombox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-family:var(--display); font-size:18px; }
  .roombox button { font-size:13px; padding:4px 10px; box-shadow:2px 2px 0 var(--ink); }
  .center { text-align:center; }
  #phaseTxt { font-family:var(--display); font-size:21px; }
  #timerTxt { font-family:var(--display); font-size:26px; color:var(--accent); min-height:32px; }
  #cnt { text-align:right; font-weight:800; }
  .panel { margin-top:14px; padding:16px; }
  .pane { display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; }
  .pane h2 { font-size:28px; }
  .pane p { margin:0; color:var(--muted); font-size:14px; }

  .lobbyplayers { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .lp { display:flex; flex-direction:column; align-items:center; gap:4px; width:76px; font-size:13px; font-weight:800; }
  .avatar { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; border:2px solid var(--ink); }
  .setbox { background:#fffaf0; border:3px solid var(--ink); border-radius:18px; padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; font-weight:700; }
  .pill { display:inline-block; background:#fff; border:2px solid var(--ink); border-radius:999px; padding:2px 12px; font-weight:800; }
  .tip { background:var(--sky-soft); border:2px solid var(--ink); border-radius:12px; padding:8px 12px; font-size:14px; color:var(--ink); max-width:580px; line-height:1.5; }
  .specline { font-size:14px; color:var(--muted); }
  .togglebtn { font-size:14px; padding:6px 14px; background:var(--sky-soft); }
  .specbadge { display:inline-block; font-family:var(--display); background:var(--sky); border:2px solid var(--ink); border-radius:999px; padding:1px 10px; font-size:14px; }
  #startBtn { font-size:22px; padding:12px 40px; }

  /* 장르 선택 */
  .genres { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:10px; width:100%; }
  .gbtn { display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 8px; text-align:center; background:#fff; }
  .gbtn .ge { font-size:30px; line-height:1.1; } .gbtn b { font-family:var(--display); font-weight:400; font-size:17px; } .gbtn small { color:var(--muted); font-size:12px; line-height:1.3; }
  .gbtn.on { background:var(--yellow); }
  .gbtn.on small { color:var(--ink); }
  .gbtn:disabled.on { opacity:1; }
  .customwrap { width:100%; max-width:580px; }
  .customwrap textarea { width:100%; min-height:110px; resize:vertical; font-size:16px; }
  .customwrap .cnt { font-size:13px; color:var(--muted); text-align:right; margin-top:4px; }

  /* 레인 */
  #cdBig { text-align:center; font-family:var(--display); font-size:84px; line-height:1; color:var(--accent); margin-top:14px; animation:cdpop .5s; }
  #cdBig:empty { display:none; }
  @keyframes cdpop { from { transform:scale(1.6); opacity:.2; } }
  .lane { display:flex; align-items:center; gap:8px; padding:6px 4px; border-radius:14px; }
  .lane.me { background:var(--yellow-soft); }
  .lane .nm { width:92px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track { position:relative; flex:1; height:30px; margin-right:34px; background:repeating-linear-gradient(90deg,#f6efe0 0 14px,#fbf6ea 14px 28px); border:2px solid var(--ink); border-radius:999px; }
  .fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--mint); opacity:.65; transition:width .25s; }
  .runner { position:absolute; top:-6px; font-size:26px; line-height:1; transition:left .25s; transform:translateX(-4px); }
  .flag { position:absolute; right:-34px; top:-4px; font-size:24px; }
  .lane .num { width:62px; text-align:right; font-weight:800; font-size:13px; color:var(--muted); }
  .lane.done .runner { animation:hop .5s infinite; }
  @keyframes hop { 50% { transform:translate(-4px,-6px); } }

  /* 타이핑 */
  #typing { text-align:center; }
  #combo { font-family:var(--display); font-size:22px; color:var(--warn); min-height:30px; }
  #combo.pop { animation:pop .25s; }
  @keyframes pop { 50% { transform:scale(1.35); } }
  #stat { color:var(--muted); font-size:14px; min-height:20px; font-weight:800; }
  #wordbox { font-family:var(--display); font-size:58px; font-weight:400; letter-spacing:3px; margin:6px 0; min-height:70px; transition:filter .2s; word-break:keep-all; line-height:1.3; }
  #wordbox[data-sz="1"] { font-size:46px; } #wordbox[data-sz="2"] { font-size:32px; letter-spacing:1px; } #wordbox[data-sz="3"] { font-size:25px; letter-spacing:0; }
  #wordbox .ok { color:var(--good); } #wordbox .rest { color:var(--ink); } #wordbox .bad { color:var(--bad); }
  #wordbox.gold .rest { color:var(--gold); } #wordbox.gold::before { content:"⭐ "; font-size:.6em; }
  #wordbox.blur { filter:blur(9px); }
  #nextbox { font-family:var(--display); color:var(--muted); font-size:18px; min-height:26px; }
  #inp { width:100%; max-width:580px; font-size:24px; text-align:center; margin-top:10px; }
  .hint { color:var(--muted); font-size:13px; margin-top:6px; }
  #inp.bad { background:#ffe0e6; animation:shake .2s; }
  @keyframes shake { 25% { transform:translateX(-5px); } 75% { transform:translateX(5px); } }
  #hitBtn { margin-top:12px; background:var(--pink-soft); font-family:var(--display); font-size:18px; }

  /* 결과 */
  .rank { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:14px; background:#faf7f0; margin:6px 0; text-align:left; font-weight:800; flex-wrap:wrap; }
  .rank.me { background:var(--yellow-soft); border:2px solid var(--ink); }
  .rank .medal { font-size:26px; width:36px; text-align:center; }
  .rank .rt { margin-left:auto; text-align:right; color:var(--accent); font-family:var(--display); line-height:1.3; }
  .rank .rt small { display:block; color:var(--muted); font-family:"Pretendard",sans-serif; font-size:12px; font-weight:700; }
  .awards { flex-basis:100%; display:flex; gap:6px; flex-wrap:wrap; padding-left:46px; }
  .award { background:var(--pink-soft); border:2px solid var(--ink); border-radius:999px; font-size:12px; padding:0 8px; font-weight:800; }
  .pbline { text-align:center; margin-top:8px; font-size:14px; color:var(--accent); font-weight:800; }
  #chatlog { font-size:14px; height:150px; overflow-y:auto; padding-right:4px; }
  #chatlog div { margin:3px 0; word-break:break-all; } #chatlog .hit { color:var(--bad); font-weight:800; } #chatlog .fin { color:var(--good); font-weight:800; } #chatlog .lead { color:var(--warn); font-weight:800; } #chatlog .gold { color:var(--gold); font-weight:800; } #chatlog .sys { color:var(--muted); }
  #chatForm { display:flex; gap:8px; margin-top:10px; }
  #chatForm input { flex:1; min-width:0; padding:8px 12px; }
  #chatForm button { padding:6px 14px; }
  #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-weight:800; opacity:0; pointer-events:none; transition:.25s; z-index:50; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  .confetti { position:fixed; top:-40px; font-size:26px; pointer-events:none; z-index:60; animation:fall 2.6s linear forwards; }
  @keyframes fall { to { transform:translateY(112vh) rotate(540deg); } }
  @media (max-width:640px) { .topbar { grid-template-columns:1fr; } #cnt { text-align:left; } #wordbox { font-size:38px; } }
</style>
</head>
<body>
<div id="modeBanner" class="banner hidden"></div>
<div id="toast"></div>

<!-- 1) 입장 화면 -->
<section id="join" class="card">
  <div class="logo">⌨️</div>
  <h1>타자 레이스</h1>
  <p class="sub">빨리 칠수록 내 캐릭터가 달려요! 먼저 결승선에 닿으면 승리 🏁</p>
  <label for="nameInput">닉네임</label>
  <input id="nameInput" maxlength="10" placeholder="예: 세훈">
  <label for="roomInput">방 번호 (영어·숫자 2~12자)</label>
  <input id="roomInput" maxlength="12" placeholder="예: 1234, sehun, ROOM7">
  <p class="joinhelp">만들 때는 원하는 번호를 정하고, 들어갈 때는 친구가 알려준 번호를 넣어요.<br>비워 두고 방 만들기를 누르면 번호가 자동으로 정해져요.</p>
  <div class="row">
    <button id="createBtn" class="primary">방 만들기</button>
    <button id="enterBtn">입장하기</button>
  </div>
  <button id="watchBtn" class="watchbtn">👀 보기만 할래요 (관전으로 입장)</button>
</section>

<!-- 2) 게임 화면 -->
<section id="game" class="hidden">
  <div class="topbar card">
    <div class="roombox">🏠 방 <b id="roomCode"></b><button id="copyBtn">🔗 초대 링크</button><button id="muteBtn">🔊</button></div>
    <div class="center"><div id="phaseTxt"></div><div id="timerTxt"></div></div>
    <div id="cnt"></div>
  </div>

  <div id="lobby" class="card panel pane"></div>

  <div id="raceBox" class="hidden">
    <div id="cdBig"></div>
    <div id="lanes" class="card panel"></div>
    <div id="typing" class="card panel hidden">
      <div id="combo"></div>
      <div id="stat"></div>
      <div id="wordbox"></div>
      <div id="nextbox"></div>
      <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력!">
      <div class="hint" id="hint"></div>
      <div><button id="hitBtn"></button></div>
    </div>
    <div id="endBox" class="card panel hidden"></div>
  </div>

  <div id="chatbox" class="card panel">
    <div id="chatlog"></div>
    <form id="chatForm"><input id="chatIn" maxlength="40" autocomplete="off" placeholder="💬 채팅 (Enter로 보내기)"><button>보내기</button></form>
  </div>
</section>

  else if (combo % COMBO_FOR_ITEM === 0) giveItem("콤보");
  let ms = 0;
  if (myN >= G.total) { done = true; ms = doneMs = Date.now() - raceStartAt; jingle(); confetti(); }
  emit({ t: "prog", id: myId, n: myN, g: G.gid, ms, k: myK, e: myE, c: bestCombo });
  render();
}
function useHit() {
  if (!canType() || !bag.length) return;
  // 나 말고 가장 앞서 있는 사람(아직 완주 안 한)을 노려요
  const cand = G.players.filter((id) => id !== myId && present[id] && (prog[id] || 0) < G.total).sort((a, b) => (prog[b] || 0) - (prog[a] || 0));
  if (!cand.length) { toast("방해할 상대가 없어요"); return; }
  const k = bag.shift(); beep(300, 0.12, "triangle", 0.08);
  emit({ t: "hit", from: myId, to: cand[0], g: G.gid, k });
  renderWord();
}
$("hitBtn").onclick = () => { useHit(); if (canType()) inp.focus(); };

// ===================== 화면 그리기 =====================
const PH = { lobby: "🎮 대기실", count: "⏳ 준비!", race: "🏃 달려라!", end: "🏁 결과" };
function render() {
  if (!net) return;
  const players = playerIds(), specs = specIds(), host = isHost();
  $("cnt").textContent = `👥 ${players.length}/${MAX_PLAYERS}` + (specs.length ? ` · 👀 ${specs.length}` : "");
  const g = genreOf(G.genre);
  $("phaseTxt").textContent = (PH[G.phase] || "") + (G.phase !== "lobby" ? ` · ${g.emoji} ${g.label}` : "");
  const inLobby = G.phase === "lobby";
  $("lobby").classList.toggle("hidden", !inLobby);
  $("raceBox").classList.toggle("hidden", inLobby);
  if (inLobby) renderLobby(players, specs, host);
  else {
    renderLanes();
    const racing = G.phase === "count" || G.phase === "race";
    const me = G.players.includes(myId) && !mySpec;
    $("typing").classList.toggle("hidden", !(racing && me && !done));
    $("endBox").classList.toggle("hidden", G.phase !== "end");
    if (G.phase === "end") renderEnd(host);
    if (racing && me && !done) {
      $("wordbox").style.visibility = G.phase === "race" ? "visible" : "hidden";
      inp.disabled = G.phase !== "race";
      renderWord();
    }
  }
}
// 대기실: 뼈대를 한 번만 만들고 칸마다 바뀔 때만 다시 그려요 (글 쓰는 중에 화면이 초기화되지 않게)
function setPart(id, key, html) { const el = $(id); if (el._k === key) return false; el._k = key; el.innerHTML = html; return true; }
function buildLobby() {
  const lob = $("lobby");
  lob.innerHTML = `<h2>⌨️ 타자 레이스</h2><p id="lobHint"></p><div id="lobPlayers" class="lobbyplayers"></div><div id="lobSpecs" class="specline"></div><div id="lobMe"></div>
    <div id="lobGenre" class="genres"></div><div class="tip" id="lobTip"></div><div class="setbox" id="lobSet"></div><div id="lobCustom" class="customwrap"></div>
    <button id="startBtn" class="primary">달리기 시작! 🚀</button>`;
  $("startBtn").onclick = startRace;
  $("lobMe").onclick = (e) => { if (e.target.closest("#specToggle")) setSpectator(!mySpec); };
  $("lobGenre").onclick = (e) => { const b = e.target.closest(".gbtn"); if (b && isHost()) emit({ t: "settings", genre: b.dataset.g }); };
  $("lobSet").onchange = (e) => {
    if (!isHost()) return;
    if (e.target.id === "setGoal") emit({ t: "settings", goal: +e.target.value });
    if (e.target.id === "setRep") emit({ t: "settings", rep: +e.target.value });
  };
  $("lobCustom").oninput = (e) => { if (e.target.id === "customTa") { customText = e.target.value; updateCustomCnt(); } };
  lob._built = true;
}
function updateCustomCnt() {
  const el = $("customCnt"); if (!el) return;
  const n = splitLines(customText, CUSTOM_LINE_LEN, CUSTOM_MAX_LINES).length;
  el.textContent = n ? `${n}줄 × ${G.rep}번 = ${Math.min(CUSTOM_MAX_ITEMS, n * G.rep)}줄이 결승선!` : "글을 한 줄 이상 써 주세요";
}
function renderLobby(players, specs, host) {
  const lob = $("lobby"); if (!lob._built) buildLobby();
  const g = genreOf(G.genre);
  $("lobHint").textContent = host ? `시작하기 전에 장르를 골라요 (참가 최대 ${MAX_PLAYERS}명, 관전은 제한 없음)` : "방장(👑)이 장르를 고르고 시작하길 기다리는 중...";
  setPart("lobPlayers", players.map((id) => id + present[id].name).join("|") + "|" + hostOrder()[0] + "|" + myId,
    players.map((id) => `<div class="lp">${avatar(id)}<span>${esc(present[id].name)}${id === hostOrder()[0] ? " 👑" : ""}${id === myId ? " (나)" : ""}</span></div>`).join(""));
  setPart("lobSpecs", specs.join("|"), specs.length ? `👀 관전: ${specs.map((id) => esc(present[id].name)).join(", ")}` : "");
  setPart("lobMe", String(mySpec), `${mySpec ? '<span class="specbadge">👀 지금 관전 모드예요</span> ' : ""}<button class="togglebtn" id="specToggle">${mySpec ? "🙋 나도 참가할래요" : "👀 관전으로 바꾸기"}</button>`);
  setPart("lobGenre", G.genre + "|" + host,
    GENRES.map((x) => `<button class="gbtn ${x.id === G.genre ? "on" : ""}" data-g="${x.id}" ${host ? "" : "disabled"}><span class="ge">${x.emoji}</span><b>${x.label}</b><small>${x.desc}</small></button>`).join(""));
  setPart("lobTip", G.genre, g.tip);
  const setKey = `${G.genre}|${G.goal}|${G.rep}|${host}`;
  if (G.genre === "custom") {
    setPart("lobSet", setKey, host
      ? `글을 <select id="setRep">${[1, 2, 3].map((n) => `<option value="${n}" ${n === G.rep ? "selected" : ""}>${n}번</option>`).join("")}</select> 반복해서 쳐요`
      : `글을 <span class="pill">${G.rep}번</span> 반복해요 <span style="color:var(--muted);font-weight:400">(방장이 정해요)</span>`);
  } else {
    setPart("lobSet", setKey, host
      ? `결승선까지 <select id="setGoal">${g.goals.map((n) => `<option value="${n}" ${n === G.goal ? "selected" : ""}>${n}${g.unit}</option>`).join("")}</select>`
      : `결승선까지 <span class="pill">${G.goal}${g.unit}</span> <span style="color:var(--muted);font-weight:400">(방장이 정해요)</span>`);
  }
  if (setPart("lobCustom", `${G.genre === "custom"}|${host}`, G.genre !== "custom" ? "" : host
    ? `<textarea id="customTa" placeholder="치고 싶은 글을 붙여넣거나 써 주세요. 한 줄만 써도 돼요!&#10;줄바꿈마다 한 줄씩 나와요. 너무 긴 줄은 자동으로 40자씩 나눠요."></textarea><div class="cnt" id="customCnt"></div>`
    : `<p>📝 방장이 글을 쓰는 중이에요. 시작하면 보여요!</p>`)) {
    if (G.genre === "custom" && host) $("customTa").value = customText;
  }
  if (G.genre === "custom" && host) updateCustomCnt();
  $("startBtn").classList.toggle("hidden", !host);
  $("startBtn").disabled = players.length < MIN_PLAYERS;
}
function renderLanes() {
  if (G.phase === "lobby") return;
  let leader = null, max = 0; for (const id of G.players) if ((prog[id] || 0) > max) { max = prog[id]; leader = id; }
  const rows = G.players.map((id) => {
    const n = prog[id] || 0, pct = Math.min(100, (n / G.total) * 100), fin = n >= G.total;
    return `<div class="lane ${id === myId ? "me" : ""} ${fin ? "done" : ""}">${avatar(id)}<span class="nm">${id === leader && G.players.length > 1 ? "👑" : ""}${esc(nameOf(id))}</span>
      <div class="track"><div class="fill" style="width:${pct}%"></div><div class="runner" style="left:${pct}%">${emojiOf(id)}</div><span class="flag">🏁</span></div>
      <span class="num">${fin && times[id] ? fmt(times[id]) : n + "/" + G.total}</span></div>`;
  }).join("");
  const el = $("lanes"); if (el._h !== rows) { el._h = rows; el.innerHTML = rows; }
}
function renderEnd(host) {
  const medals = ["🥇", "🥈", "🥉"], g = genreOf(G.genre), aw = awardsOf(G.final || [], G.total);
  const rows = (G.final || []).map((r, i) => {
    const fin = r.n >= G.total;
    return `<div class="rank ${r.id === myId ? "me" : ""}"><span class="medal">${medals[i] || i + 1}</span>${avatar(r.id)}<span>${esc(nameOf(r.id))}</span>
    <span class="rt">${fin ? fmt(r.ms) : `미완주 ${r.n}/${G.total}`}<small>${fin ? `⌨️ ${cpmOf(r.k, r.ms)}타/분 · ` : ""}깔끔하게 친 ${g.unit} ${accOf(r)}%</small></span>
    ${aw[r.id] ? `<div class="awards">${aw[r.id].map((a) => `<span class="award">${a}</span>`).join("")}</div>` : ""}</div>`;
  }).join("");
  let pb = ""; try { const v = +localStorage.getItem("typingBest_" + G.genre) || 0; if (v) pb = `<div class="pbline">📌 내 ${g.label} 최고 기록: ${v}타/분</div>`; } catch (e) {}
  const html = `<h2 style="text-align:center">🏆 결과 · ${g.emoji} ${g.label}</h2>${rows}${pb}
    <div style="text-align:center;margin-top:14px">${host ? '<button id="againBtn" class="primary">🔁 한 판 더!</button> <button id="lobbyBtn">대기실로 (장르 바꾸기)</button>' : "<p style='color:var(--muted)'>방장이 다음 판을 정할 거예요</p>"}</div>`;
  const el = $("endBox"); if (el._h === html) return;
  el._h = html; el.innerHTML = html;
  if (host) { $("againBtn").onclick = startRace; $("lobbyBtn").onclick = () => emit({ t: "lobby" }); }
}

// 타이머 + 실시간 타수 + 방해 효과 해제
setInterval(() => {
  const now = Date.now();
  if (G.phase === "count") {
    const left = Math.ceil((cdEnd - now) / 1000), t = left > 0 ? String(left) : "GO!";
    if ($("cdBig").textContent !== t) { $("cdBig").textContent = t; if (left > 0) beep(520, 0.08, "triangle", 0.06); }
    $("timerTxt").textContent = ""; $("stat").textContent = "";
  } else if (G.phase === "race") {
    if (now - raceStartAt > 700) $("cdBig").textContent = "";
    const el = done ? doneMs : now - raceStartAt;
    $("timerTxt").textContent = fmt(el);
    $("stat").textContent = el > 2000 && myK ? `⌨️ ${cpmOf(myK, el)}타/분` : "";
  } else { $("cdBig").textContent = ""; $("timerTxt").textContent = ""; $("stat").textContent = ""; }
  $("wordbox").classList.toggle("blur", now < hitUntil);
}, 100);
</script>
